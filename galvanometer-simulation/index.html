
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galvanometer: Calibrated Layout</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    /* Absolute reset to strictly prevent any scrolling or overflow */
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #020617; touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    /* Tightly boxed Arcade Slider */
    input[type=range].arcade-slider {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      padding: 0;
      margin: 0;
    }
    input[type=range].arcade-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 32px;
      width: 32px;
      border-radius: 50%;
      background: #facc15;
      cursor: grab;
      margin-top: -10px;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.6), inset 0 0 6px rgba(255,255,255,0.6);
      border: 3px solid #fff;
    }
    input[type=range].arcade-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.1); background: #fde047; }
    input[type=range].arcade-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 12px;
      cursor: pointer;
      background: #334155;
      border-radius: 10px;
      border: 1px inset #0f172a;
    }

    .btn-toggle { transition: all 0.2s ease; }
    .btn-toggle.active { background-color: #4f46e5; border-color: #818cf8; color: white; transform: scale(1.05); }

    .font-tabular { font-variant-numeric: tabular-nums; }

    /* Muted 3D Floating Labels */
    .label-3d {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 5;
    }
    .label-b { color: rgba(16, 185, 129, 0.85); font-size: 1.2rem; font-style: italic; font-family: serif; }
    .label-mf { color: rgba(244, 63, 94, 0.85); font-size: 0.95rem; }
  </style>
</head>

<body class="fixed inset-0 flex flex-col bg-[#020617] text-slate-100 m-0 p-0 overflow-hidden">

  <!-- TOP 75%: Unobstructed 3D Canvas -->
  <main id="canvas-wrapper" class="relative w-full h-[75%] shrink-0 overflow-hidden shadow-inner">
    <div id="canvas-container" class="absolute inset-0"></div>

    <!-- HTML Overlays for 3D Tags (B & MF) -->
    <div id="labels-container" class="absolute inset-0 z-10 pointer-events-none">
      <div id="label-b" class="label-3d label-b">B</div>
      <div id="label-mf-left" class="label-3d label-mf opacity-0">MF</div>
      <div id="label-mf-right" class="label-3d label-mf opacity-0">MF</div>
    </div>

    <!-- Floating View Controls (Slo-Mo Only) -->
    <aside class="absolute right-3 top-3 flex flex-col space-y-2 z-10 pointer-events-none">
      <button id="btn-slomo" class="btn-toggle glass-panel pointer-events-auto p-1.5 w-10 h-10 sm:w-12 sm:h-12 flex flex-col items-center justify-center text-amber-400 hover:bg-slate-800 shadow-lg">
        <i class="fa-solid fa-turtle text-sm sm:text-lg mb-0.5"></i>
        <span class="text-[7px] sm:text-[8px] font-black uppercase">Slo-Mo</span>
      </button>
    </aside>
  </main>

  <!-- BOTTOM 25%: Secure Control Dashboard -->
  <footer class="relative w-full h-[25%] shrink-0 bg-[#0b1121] border-t border-slate-700/80 p-2 sm:p-3 flex items-center justify-center overflow-hidden z-20">
    <div class="max-w-5xl w-full h-full flex flex-row gap-2 sm:gap-4 items-stretch">
      
      <!-- LEFT 1/3: Torque Battle Monitor -->
      <div class="w-1/3 bg-slate-800/40 rounded-lg p-2 border border-slate-700 flex flex-col justify-between overflow-hidden">
        <h3 class="text-[9px] sm:text-[10px] font-black text-slate-400 uppercase tracking-widest text-center shrink-0">Torque Battle</h3>
        
        <div class="flex-1 flex flex-col justify-center space-y-2">
          <!-- Magnetic Push (Red) -->
          <div>
            <div class="flex justify-between text-[9px] sm:text-[10px] font-bold text-rose-400 mb-0.5">
              <span>Mag Push</span>
              <span id="txt-mag" class="font-tabular">0.00</span>
            </div>
            <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700/50">
              <div id="bar-mag" class="h-full bg-rose-500 rounded-full w-0 transition-all duration-75"></div>
            </div>
          </div>

          <!-- Spring Pull (Blue) -->
          <div>
            <div class="flex justify-between text-[9px] sm:text-[10px] font-bold text-cyan-400 mb-0.5">
              <span>Spr Pull</span>
              <span id="txt-spr" class="font-tabular">0.00</span>
            </div>
            <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700/50">
              <div id="bar-spr" class="h-full bg-cyan-500 rounded-full w-0 transition-all duration-75"></div>
            </div>
          </div>
        </div>
        
        <p id="torque-status" class="text-[8px] sm:text-[9px] text-center font-bold text-slate-400 shrink-0">Waiting...</p>
      </div>

      <!-- RIGHT 2/3: Current Controller Area -->
      <div class="w-2/3 bg-slate-800/40 rounded-lg p-2 border border-slate-700 flex flex-col justify-between overflow-hidden">
        
        <!-- Live Numbers Header -->
        <div class="flex justify-between items-center w-full px-1 shrink-0">
          <span class="text-[10px] text-slate-400 font-bold">-30 mA</span>
          <span class="text-[11px] sm:text-xs font-black text-amber-400 bg-slate-900 px-2 sm:px-3 py-0.5 rounded-lg border border-amber-500/30 shadow-md min-w-[65px] text-center font-tabular" id="hud-current">
            0 mA
          </span>
          <span class="text-[10px] text-slate-400 font-bold">+30 mA</span>
        </div>

        <!-- Slider & Buttons Row -->
        <div class="flex-1 flex items-center justify-between space-x-2 sm:space-x-4 w-full">
          <button id="btn-zero" class="shrink-0 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-700 hover:bg-slate-600 border-2 border-slate-500 flex items-center justify-center font-black text-sm shadow-md active:scale-90 transition">
            0
          </button>

          <div class="flex-1 relative flex items-center h-full">
            <div class="absolute left-1/2 w-0.5 h-4 bg-slate-500 -translate-x-1/2 z-0 pointer-events-none"></div>
            <input type="range" id="main-slider" min="-30" max="30" step="0.1" value="0" class="arcade-slider relative z-10 w-full">
          </div>

          <button id="btn-autoplay" class="shrink-0 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 border-2 border-indigo-400 flex items-center justify-center text-sm shadow-md shadow-indigo-600/30 active:scale-90 transition">
            ▶️
          </button>
        </div>

        <!-- Educational Text Bottom -->
        <div class="shrink-0 text-center">
          <p id="explanation-text" class="text-[9px] sm:text-[11px] font-bold text-slate-400 leading-tight">
            Forces push UP/DOWN rotating the coil around Z-axis!
          </p>
        </div>
      </div>

    </div>
  </footer>

  <!-- MAIN SIMULATION SCRIPT -->
  <script>
    const state = {
      targetCurrent: 0,
      actualCurrent: 0,
      
      // Rotation around Z-axis
      coilAngle: 0,
      angularVelocity: 0,
      springConstant: 0.15,   
      damping: 0.88,          
      
      // PERFECT CALIBRATION:
      // We want exactly Math.PI/4 (45 degrees) of rotation at 30mA.
      // angle = (Current * TorqueMult) / SpringConst
      // Math.PI/4 = (30 * TorqueMult) / 0.15
      // TorqueMult = (Math.PI/4 * 0.15) / 30 = 0.00392699
      torqueMultiplier: 0.003927,
      
      magTorque: 0,
      springTorque: 0,

      isSloMo: false,
      isAutoPlaying: false,
      autoPlayTime: 0,
    };

    let scene, camera, renderer, orbit;
    let coilGroup, physicalSpring;
    let fLeftArrow, fRightArrow; 
    let currentParticles = [];

    // Static 'B' Label position perfectly over the top field line
    const bLabelPos = new THREE.Vector3(0, 0.9, 0); 

    init3D();
    setupUI();
    animate();

    function init3D() {
      const wrapper = document.getElementById('canvas-wrapper');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a); 

      // Initialize camera mapped specifically to the Top 75% wrapper size
      camera = new THREE.PerspectiveCamera(40, wrapper.clientWidth / wrapper.clientHeight, 0.1, 100);
      setCameraFree(); 

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      wrapper.appendChild(renderer.domElement);

      orbit = new THREE.OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;
      orbit.dampingFactor = 0.05;
      orbit.maxPolarAngle = Math.PI / 2 + 0.1; 
      orbit.minDistance = 2;
      orbit.maxDistance = 15;
      orbit.target.set(0, 0.8, 0); 

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      
      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(5, 12, 10);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 1024;
      mainLight.shadow.mapSize.height = 1024;
      scene.add(mainLight);

      const fillLight = new THREE.PointLight(0x818cf8, 1.0, 10);
      fillLight.position.set(-4, 3, -4);
      scene.add(fillLight);

      buildHardware();
      buildVisualizers();

      // Dynamic Resizing bounded to the 75% wrapper box
      const resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
          const { width, height } = entry.contentRect;
          if(width === 0 || height === 0) continue;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
      });
      resizeObserver.observe(wrapper);
    }

    function buildHardware() {
      // 1. Spaced Out Concave Magnets
      function createConcavePole(colorHex, startAngle, sweepAngle) {
        const shape = new THREE.Shape();
        const innerR = 1.8; 
        const outerR = 2.8;
        
        shape.absarc(0, 0, outerR, startAngle, startAngle + sweepAngle, false);
        shape.lineTo(innerR * Math.cos(startAngle + sweepAngle), innerR * Math.sin(startAngle + sweepAngle));
        shape.absarc(0, 0, innerR, startAngle + sweepAngle, startAngle, true);
        shape.lineTo(outerR * Math.cos(startAngle), outerR * Math.sin(startAngle));

        const extrudeSettings = { depth: 3.0, bevelEnabled: false, curveSegments: 32 };
        const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geo.translate(0, 0, -1.5); 

        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.2 }));
        mesh.castShadow = true;
        return mesh;
      }

      const sweep = Math.PI / 2.5; 
      const north = createConcavePole(0xef4444, Math.PI - sweep/2, sweep);
      scene.add(north);

      const south = createConcavePole(0x3b82f6, -sweep/2, sweep);
      scene.add(south);

      // 2. Horizontal Coil System
      coilGroup = new THREE.Group();
      const wireMat = new THREE.MeshStandardMaterial({ color: 0xf97316, metalness: 0.5, roughness: 0.2 });
      const wireRadius = 0.06;

      const leftWire = new THREE.Mesh(new THREE.CylinderGeometry(wireRadius, wireRadius, 2.4, 16), wireMat);
      leftWire.rotation.x = Math.PI/2;
      leftWire.position.set(-1.4, 0, 0); 
      coilGroup.add(leftWire);

      const rightWire = new THREE.Mesh(new THREE.CylinderGeometry(wireRadius, wireRadius, 2.4, 16), wireMat);
      rightWire.rotation.x = Math.PI/2;
      rightWire.position.set(1.4, 0, 0);
      coilGroup.add(rightWire);

      const frontWire = new THREE.Mesh(new THREE.CylinderGeometry(wireRadius, wireRadius, 2.8, 16), wireMat);
      frontWire.rotation.z = Math.PI/2;
      frontWire.position.set(0, 0, 1.2);
      coilGroup.add(frontWire);

      const backWire = new THREE.Mesh(new THREE.CylinderGeometry(wireRadius, wireRadius, 2.8, 16), wireMat);
      backWire.rotation.z = Math.PI/2;
      backWire.position.set(0, 0, -1.2);
      coilGroup.add(backWire);

      const pointer = new THREE.Mesh(
        new THREE.ConeGeometry(0.06, 3.8, 16).translate(0, 1.9, 0),
        new THREE.MeshBasicMaterial({ color: 0xfacc15 })
      );
      coilGroup.add(pointer);
      scene.add(coilGroup);

      // 3. Physical Hairspring
      physicalSpring = new THREE.Group();
      physicalSpring.position.set(0, 0, 1.35); 
      scene.add(physicalSpring);
      updatePhysicalSpring(0);

      // 4. Improved Scale Arc
      const scaleGroup = new THREE.Group();
      // Arc spans slightly MORE than 90 degrees (108 degrees) to give padding for overshoots
      const arcGeo = new THREE.TorusGeometry(3.6, 0.15, 16, 64, Math.PI * 0.6);
      const arcMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const scaleArc = new THREE.Mesh(arcGeo, arcMat);
      scaleArc.rotation.z = Math.PI/2 - (Math.PI * 0.6)/2; // Center exactly at +Y
      scaleGroup.add(scaleArc);

      // Add clear Tick Marks (-30, 0, +30)
      const tickGeo = new THREE.BoxGeometry(0.06, 0.5, 0.35);
      const tickMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

      // Zero mark (+Y)
      const tick0 = new THREE.Mesh(tickGeo, tickMat);
      tick0.position.set(0, 3.6, 0);
      scaleGroup.add(tick0);

      // +30mA mark (Right side, -45 degrees from +Y => Math.PI/4 in polar)
      const tickPlus = new THREE.Mesh(tickGeo, tickMat);
      tickPlus.position.set(3.6 * Math.cos(Math.PI/4), 3.6 * Math.sin(Math.PI/4), 0);
      tickPlus.rotation.z = Math.PI/4;
      scaleGroup.add(tickPlus);

      // -30mA mark (Left side, +45 degrees from +Y => 3*Math.PI/4 in polar)
      const tickMinus = new THREE.Mesh(tickGeo, tickMat);
      tickMinus.position.set(3.6 * Math.cos(3*Math.PI/4), 3.6 * Math.sin(3*Math.PI/4), 0);
      tickMinus.rotation.z = -Math.PI/4;
      scaleGroup.add(tickMinus);

      scene.add(scaleGroup);
    }

    function buildVisualizers() {
      const fieldColor = 0x10b981;
      
      function createStaticArrow(xStart, xEnd, yPos, zPos) {
        const dir = new THREE.Vector3(1, 0, 0);
        const origin = new THREE.Vector3(xStart, yPos, zPos);
        const length = Math.abs(xEnd - xStart);
        return new THREE.ArrowHelper(dir, origin, length, fieldColor, 0.4, 0.25); 
      }

      scene.add(createStaticArrow(-1.8, 1.8, 0.7, 0)); 
      scene.add(createStaticArrow(-1.8, 1.8, -0.7, 0)); 
      scene.add(createStaticArrow(-1.8, 1.8, 0, 0.9)); 
      scene.add(createStaticArrow(-1.8, 1.8, 0, -0.9)); 
      scene.add(createStaticArrow(-1.8, 1.8, 0, 0)); 

      const curGeo = new THREE.SphereGeometry(0.14, 16, 16); 
      const curMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      for(let i=0; i<16; i++) {
        const p = new THREE.Mesh(curGeo, curMat);
        coilGroup.add(p);
        currentParticles.push({ mesh: p, progress: i/16 });
      }

      function createForceArrow() {
        const g = new THREE.Group();
        // Longer arrows to show force intensely
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.0).translate(0, 1.0, 0), new THREE.MeshBasicMaterial({color: 0xf43f5e, transparent:true, opacity:0.9}));
        const head = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4).translate(0, 2.0, 0), new THREE.MeshBasicMaterial({color: 0xf43f5e, transparent:true, opacity:0.9}));
        g.add(shaft, head);
        return g;
      }
      
      fLeftArrow = createForceArrow();
      fLeftArrow.position.set(-1.4, 0, 0); 
      coilGroup.add(fLeftArrow);

      fRightArrow = createForceArrow();
      fRightArrow.position.set(1.4, 0, 0); 
      coilGroup.add(fRightArrow);
    }

    function updatePhysicalSpring(twistAngle) {
      const points = [];
      const turns = 3.5;
      const maxR = 0.8;
      const effectiveTurns = turns + (twistAngle / (Math.PI * 2));
      
      for(let i=0; i<=80; i++) {
        const t = i/80;
        const angle = t * effectiveTurns * Math.PI * 2;
        const r = t * maxR;
        points.push(new THREE.Vector3(r * Math.cos(angle), r * Math.sin(angle), 0));
      }
      
      const curve = new THREE.CatmullRomCurve3(points);
      const newGeo = new THREE.TubeGeometry(curve, 80, 0.025, 8, false);
      
      physicalSpring.children.forEach(c => { c.geometry.dispose(); physicalSpring.remove(c); });
      physicalSpring.add(new THREE.Mesh(newGeo, new THREE.MeshStandardMaterial({ color: 0x0ea5e9, metalness: 0.6 })));
    }

    function updateLabels() {
      const wrapper = document.getElementById('canvas-wrapper');
      const rect = wrapper.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      // Update B Label
      const bEl = document.getElementById('label-b');
      const bTemp = bLabelPos.clone();
      bTemp.project(camera);
      if (bTemp.z < 1) {
        bEl.style.left = `${(bTemp.x * .5 + .5) * w}px`;
        bEl.style.top = `${(bTemp.y * -.5 + .5) * h}px`;
      }

      // Update MF Labels
      const mfLeftEl = document.getElementById('label-mf-left');
      const mfRightEl = document.getElementById('label-mf-right');
      
      const showForce = Math.abs(state.actualCurrent) > 0.5;
      
      if (showForce) {
        mfLeftEl.classList.remove('opacity-0');
        mfRightEl.classList.remove('opacity-0');

        // Perfect target mapping for the elongated arrows
        const headOffset = new THREE.Vector3(0, 2.3, 0); 
        
        const leftWorldPos = fLeftArrow.localToWorld(headOffset.clone());
        const rightWorldPos = fRightArrow.localToWorld(headOffset.clone());

        leftWorldPos.project(camera);
        rightWorldPos.project(camera);

        if (leftWorldPos.z < 1) {
          mfLeftEl.style.left = `${(leftWorldPos.x * .5 + .5) * w}px`;
          mfLeftEl.style.top = `${(leftWorldPos.y * -.5 + .5) * h}px`;
        }
        if (rightWorldPos.z < 1) {
          mfRightEl.style.left = `${(rightWorldPos.x * .5 + .5) * w}px`;
          mfRightEl.style.top = `${(rightWorldPos.y * -.5 + .5) * h}px`;
        }
      } else {
        mfLeftEl.classList.add('opacity-0');
        mfRightEl.classList.add('opacity-0');
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const dt = state.isSloMo ? 0.05 : 0.5; 

      if(state.isAutoPlaying) {
        state.autoPlayTime += 0.05 * dt;
        state.targetCurrent = Math.sin(state.autoPlayTime) * 30;
        document.getElementById('main-slider').value = state.targetCurrent;
      }

      state.actualCurrent += (state.targetCurrent - state.actualCurrent) * 0.15 * dt;

      // PHYSICS: Torque around Z-axis
      state.magTorque = -state.actualCurrent * state.torqueMultiplier;
      state.springTorque = -state.coilAngle * state.springConstant;

      const netTorque = state.magTorque + state.springTorque;
      state.angularVelocity += netTorque * dt;
